name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-northeast-1"
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Run Terraform Test
        run: terraform test

      # ---------------------------------------------------
      # CD (Deploy) Section
      # ---------------------------------------------------
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      # ---------------------------------------------------
      # Ansible Configuration Management
      # ---------------------------------------------------

      # 1. IPアドレスの取得
      # TerraformのOutputからEC2のIPを取り出し、環境変数に保存します
      - name: Get EC2 Public IP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: get_ip
        run: |
          echo "EC2_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV

      # 2. Ansibleのインストール
      # Pythonのパッケージマネージャ(pip)を使ってAnsibleを入れます
      - name: Install Ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          pip install ansible

      # 3. SSH鍵の生成
      # Secretsに登録した鍵をファイルとして書き出し、権限を600(自分だけ読み書き可)にします
      - name: Create SSH Key
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # 4. Ansible Playbookの実行
      # -u: ユーザー名(Amazon Linux 2023はec2-user)
      # --private-key: 鍵ファイルの指定
      # -i: インベントリ(接続先)。末尾にカンマをつけると「ファイルじゃなくてIPだよ」という合図になります
      # ANSIBLE_HOST_KEY_CHECKING=False: 「初めて接続するけど本当にいい？」という確認をスキップします
      - name: Run Ansible Playbook
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i "${{ env.EC2_IP }}," -u ec2-user --private-key private_key.pem ansible/playbook.yml