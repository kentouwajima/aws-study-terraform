name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-northeast-1"
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Run Terraform Test
        run: terraform test

      # ---------------------------------------------------
      # CD (Deploy) Section
      # ---------------------------------------------------
      
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      # ---------------------------------------------------
      # Ansible Configuration Management (Dynamic Security Group)
      # ---------------------------------------------------

      # 1. 環境変数のセットアップ (IP取得, 鍵作成)
      # 自身のIP、EC2のIP、SGのIDを取得し、SSH鍵ファイルもここで作成します
      - name: Configure Dynamic IP & Secrets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: config_dynamic_env
        run: |
          # 自分のグローバルIPを調べる
          MY_IP=$(curl -s http://checkip.amazonaws.com)
          echo "DETECTED_IP=$MY_IP" >> $GITHUB_ENV
          
          # Terraform Outputから情報を取得
          echo "EC2_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV
          echo "SG_ID=$(terraform output -raw security_group_id)" >> $GITHUB_ENV
          
          # SSH鍵の生成
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # 2. セキュリティグループに穴を開ける (自分のIPだけ許可)
      - name: Authorize Security Group Ingress
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Adding IP ${{ env.DETECTED_IP }} to Security Group ${{ env.SG_ID }}"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.DETECTED_IP }}/32

      # 3. Ansibleのインストール
      - name: Install Ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pip install ansible

      # 4. Ansible Playbookの実行
      - name: Run Ansible Playbook
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # IP許可反映のタイムラグ対策として少し待つ
          sleep 10
          ansible-playbook -i "${{ env.EC2_IP }}," -u ec2-user --private-key private_key.pem ansible/playbook.yml

      # 5. セキュリティグループの穴を塞ぐ (必ず実行)
      # 「if: always()」をつけることで、Ansibleがエラーになっても必ず実行され、開けっ放しを防ぎます
      - name: Revoke Security Group Ingress
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Removing IP ${{ env.DETECTED_IP }} from Security Group ${{ env.SG_ID }}"
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.DETECTED_IP }}/32