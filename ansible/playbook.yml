- name: Setup Web Server and App
  hosts: all
  user: ec2-user
  become: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_repo_url: "https://github.com/koujienami/aws-study.git"
    app_dir: "/home/ec2-user/aws-study"

  tasks:
    # -----------------------------------------------
    # 1. 接続確認 & OS基本設定
    # -----------------------------------------------
    - name: Ping the server
      ansible.builtin.ping:

    # OSアップデートは時間がかかる場合があるため、必要なければコメントアウトのままでOK
    # - name: Update all packages
    #   ansible.builtin.dnf:
    #     name: "*"
    #     state: latest

    # -----------------------------------------------
    # 2. ミドルウェアのインストール
    # -----------------------------------------------
    - name: Install Java 21
      ansible.builtin.dnf:
        name: java-21-amazon-corretto-devel
        state: present

    - name: Install Git
      ansible.builtin.dnf:
        name: git
        state: present

    # ★ここを修正: 外部サイトからはDLせず、AWS標準のMariaDB(MySQL互換)を入れる
    # これでダウンロードエラーや403は絶対に起きません
    - name: Install MySQL Client (MariaDB)
      ansible.builtin.dnf:
        name: mariadb105
        state: present

    # -----------------------------------------------
    # 3. アプリケーションのデプロイ
    # -----------------------------------------------
    - name: Remove existing app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Clone SpringBoot Repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Grant execute permission to gradlew
      ansible.builtin.file:
        path: "{{ app_dir }}/gradlew"
        mode: '0755'

    # -----------------------------------------------
    # 4. アプリケーションの起動
    # -----------------------------------------------
    - name: Stop existing Java process
      ansible.builtin.shell: "pkill -f 'java -jar' || true"
      ignore_errors: true

    - name: Start SpringBoot App (gradlew bootRun)
      ansible.builtin.shell: |
        nohup ./gradlew bootRun > app.log 2>&1 &
      args:
        chdir: "{{ app_dir }}"
      async: 45
      poll: 0

    # -----------------------------------------------
    # 5. インストール確認
    # -----------------------------------------------
    - name: Check Java version
      ansible.builtin.command: java -version
      register: java_result
      changed_when: false

    - name: Print Java version
      ansible.builtin.debug:
        var: java_result.stderr_lines

    # MariaDBを入れてもコマンドは 'mysql' のまま使えます
    - name: Check MySQL Client version
      ansible.builtin.command: mysql --version
      register: mysql_result
      changed_when: false

    - name: Print MySQL version
      ansible.builtin.debug:
        var: mysql_result.stdout