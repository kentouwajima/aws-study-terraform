- name: Setup Web Server and App
  hosts: all
  user: ec2-user
  become: true  # 基本は root (sudo) で実行

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_repo_url: "https://github.com/koujienami/aws-study.git"
    app_dir: "/home/ec2-user/aws-study"

  tasks:
    # -----------------------------------------------
    # 1. 接続確認 & OS基本設定
    # -----------------------------------------------
    - name: Ping the server
      ansible.builtin.ping:

    # -----------------------------------------------
    # 2. ミドルウェアのインストール
    # -----------------------------------------------
    - name: Install Java 21
      ansible.builtin.dnf:
        name: java-21-amazon-corretto-devel
        state: present

    - name: Install Git
      ansible.builtin.dnf:
        name: git
        state: present

    # ★修正ポイント: OSによってパッケージ名を切り替える
    # Amazon Linux 2023 の場合
    - name: Set MariaDB package name for Amazon Linux 2023
      ansible.builtin.set_fact:
        mariadb_pkg: "mariadb105"
      when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2023"

    # それ以外（Amazon Linux 2など）の場合のデフォルト設定
    - name: Set MariaDB package name for others
      ansible.builtin.set_fact:
        mariadb_pkg: "mariadb"
      when: mariadb_pkg is not defined

    # 変数を使ってインストール（ハードコーディング回避）
    - name: Install MySQL Client (MariaDB)
      ansible.builtin.dnf:
        name: "{{ mariadb_pkg }}"
        state: present

    # -----------------------------------------------
    # 3. アプリケーションのデプロイ
    # -----------------------------------------------
    - name: Remove existing app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Clone SpringBoot Repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: ec2-user  # ★ec2-user権限で実行

    - name: Grant execute permission to gradlew
      ansible.builtin.file:
        path: "{{ app_dir }}/gradlew"
        mode: '0755'
      become_user: ec2-user  # ★ec2-user権限で実行

    # -----------------------------------------------
    # 4. アプリケーションの起動
    # -----------------------------------------------
    - name: Stop existing Java process
      ansible.builtin.shell: "pkill -f 'java -jar' || true"
      ignore_errors: true
      become_user: ec2-user  # ★ec2-user権限で実行

    - name: Start SpringBoot App (gradlew bootRun)
      ansible.builtin.shell: |
        nohup ./gradlew bootRun > app.log 2>&1 &
      args:
        chdir: "{{ app_dir }}"
      async: 45
      poll: 0
      become_user: ec2-user  # ★ec2-user権限で実行

    # -----------------------------------------------
    # 5. インストール確認
    # -----------------------------------------------
    - name: Check Java version
      ansible.builtin.command: java -version
      register: java_result
      changed_when: false
      become_user: ec2-user

    - name: Print Java version
      ansible.builtin.debug:
        var: java_result.stderr_lines