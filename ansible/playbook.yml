- name: Setup Web Server and App
  hosts: all
  user: ec2-user
  become: true  # 基本は root (sudo) で実行

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_repo_url: "https://github.com/koujienami/aws-study.git"
    app_dir: "/home/ec2-user/aws-study"

  tasks:
    # -----------------------------------------------
    # 0. SSH接続待機 (起動直後の接続エラー回避)
    # -----------------------------------------------
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        delay: 0
        timeout: 300

    # -----------------------------------------------
    # 1. 接続確認 & OS基本設定
    # -----------------------------------------------
    - name: Ping the server
      ansible.builtin.ping:

    # -----------------------------------------------
    # 2. ミドルウェアのインストール
    # -----------------------------------------------
    - name: Install Java 21
      ansible.builtin.dnf:
        name: java-21-amazon-corretto-devel
        state: present

    - name: Install Git
      ansible.builtin.dnf:
        name: git
        state: present

    # OSによってMariaDBのパッケージ名を切り替える
    - name: Set MariaDB package name for Amazon Linux 2023
      ansible.builtin.set_fact:
        mariadb_pkg: "mariadb105"
      when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2023"

    - name: Set MariaDB package name for others
      ansible.builtin.set_fact:
        mariadb_pkg: "mariadb"
      when: mariadb_pkg is not defined

    - name: Install MySQL Client (MariaDB)
      ansible.builtin.dnf:
        name: "{{ mariadb_pkg }}"
        state: present

    # -----------------------------------------------
    # 3. アプリケーションのデプロイ
    # -----------------------------------------------
    - name: Remove existing app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Clone SpringBoot Repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: ec2-user  # git cloneは ec2-user で行う

    - name: Grant execute permission to gradlew
      ansible.builtin.file:
        path: "{{ app_dir }}/gradlew"
        mode: '0755'
      become_user: ec2-user

    # -----------------------------------------------
    # 4. Systemd設定ファイルの作成 (ここが今回最大の変更点)
    # -----------------------------------------------
    - name: Create Systemd Unit file for SpringBoot App
      ansible.builtin.copy:
        dest: /etc/systemd/system/webapp.service
        content: |
          [Unit]
          Description=Spring Boot Application
          After=network.target

          [Service]
          User=ec2-user
          Group=ec2-user
          WorkingDirectory={{ app_dir }}
          ExecStart={{ app_dir }}/gradlew bootRun
          Restart=always
          RestartSec=10
          StandardOutput=syslog
          StandardError=syslog
          SyslogIdentifier=webapp

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      # このタスクは /etc 配下に書くので root (become: true) のままでOK

    # -----------------------------------------------
    # 5. アプリケーションの起動 (Systemd経由)
    # -----------------------------------------------
    - name: Enable and start WebApp service
      ansible.builtin.systemd:
        name: webapp
        state: restarted  # コード更新時は再起動したいので restarted
        enabled: yes      # サーバー再起動時も自動起動させる
        daemon_reload: yes

    # -----------------------------------------------
    # 6. 起動待機（ポート8080が開くまで待つ）
    # -----------------------------------------------
    - name: Wait for application to start
      ansible.builtin.wait_for:
        port: 8080
        delay: 15
        timeout: 300
        state: started